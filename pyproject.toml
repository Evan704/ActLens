[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "actlens"
dynamic = ["version"]
description = "Interactive viewer for the activations of a Hugging Face model during a forward pass"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["interpretability", "transformers", "activations", "visualization", "huggingface"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]
# Lower bounds are the major versions the project is developed and tested against.
dependencies = [
    "torch>=2",
    "transformers>=5",
    "nnsight>=0.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "build"]

[project.scripts]
actlens = "actlens.cli:main"

[tool.hatch.version]
path = "backend/actlens/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["backend/actlens"]

# hatch_build.py bundles the built UI (frontend/dist) into wheels and sdists.
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.sdist]
include = ["/backend", "/README.md", "/LICENSE", "/hatch_build.py", "/frontend/src", "/frontend/index.html", "/frontend/package.json",
           "/frontend/package-lock.json", "/frontend/tsconfig.json", "/frontend/vite.config.ts"]
